name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Offline security and integration imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m compileall -q custom_components/safeconnect tests
      - run: python -m pip install 'pytest>=8,<10' 'homeassistant==2026.11.1'
      # Module form preserves repository-root namespace package imports in CI.
      - run: python -m pytest -q tests/test_oauth_state_security.py tests/test_oauth_redirect.py tests/test_config_flow_contract.py tests/test_security_freshness.py
      - run: python -c 'import custom_components.safeconnect; import custom_components.safeconnect.config_flow; import custom_components.safeconnect.application_credentials; print("HA 2026.11.1 imports passed")'
      - run: python -m json.tool custom_components/safeconnect/manifest.json >/dev/null
